name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up uv
        uses: astral-sh/setup-uv@v7

      - name: test Codex hooks
        run: uv run --no-project --script .codex/hooks/agent_loop_test.py

      - name: set up go 1.26.7
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
        id: go

      - name: check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: check portability
        run: make check-portability

      - name: build and test
        run: |
          go test -race -timeout=100s -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov_tmp ./...
          grep -v -E "_mock.go|/mocks/" $GITHUB_WORKSPACE/profile.cov_tmp > $GITHUB_WORKSPACE/profile.cov

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"

      - name: build device binary
        run: make build-device build-device-ctl build-device-noasm

      - name: upload echod arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echod-linux-arm64
          path: .bin/linux_arm64/echod

      - name: upload echoctl arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoctl-linux-arm64
          path: .bin/linux_arm64/echoctl
